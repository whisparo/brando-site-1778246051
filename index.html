<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر ملابس</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body>
    <!-- القسم الرئيسي -->
    <header class="bg-white dark:bg-gray-800 py-4">
        <nav class="container mx-auto flex justify-between items-center">
            <a href="#" class="text-lg font-bold tracking-widest text-gray-900 dark:text-white">متجر ملابس</a>
            <button class="lg:hidden md:hidden sm:hidden text-lg font-bold text-gray-900 dark:text-white" id="menu-toggle">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-2 2h-3m-6 0a1 1 0 001-1h3m5 4v-5a1 1 0 01-1-1h-5a1 1 0 00-1 1v5m3 4h-7"></path>
                </svg>
            </button>
        </nav>
    </header>
    <!-- القسم الرئيسي -->
    <main class="container mx-auto py-12">
        <!-- القسم الهرؤي -->
        <section class="bg-no-repeat bg-center bg-cover" style="background-image: url('image.jpg');">
            <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-b from-transparent to-gray-900 opacity-50"></div>
            <div class="container mx-auto text-white relative z-10 py-12">
                <h1 class="text-5xl font-bold md:text-7xl lg:text-8xl text-gray-100 dark:text-white mb-8">متجر ملابس رائعة</h1>
                <p class="text-xl text-gray-200 dark:text-white md:text-2xl lg:text-3xl">ملابس عالية الجودة وتصميمات رائعة</p>
            </div>
        </section>
        <!-- القسم الخاص بأيقونات الخدمات -->
        <section class="py-12">
            <div class="container mx-auto text-center mb-12">
                <h2 class="text-3xl font-bold text-gray-900 dark:text-white mb-8">خدماتنا</h2>
            </div>
            <div class="container mx-auto flex flex-wrap justify-center md:justify-start -mx-4 mb-12">
                <div class="w-full p-4 md:w-1/3 lg:w-1/3 xl:w-1/3">
                    <div class="bg-white dark:bg-gray-800 shadow-lg rounded-lg overflow-hidden">
                        <img class="object-cover w-full h-full" src="image1.jpg" alt="Service 1">
                        <div class="p-8">
                            <h3 class="text-lg font-bold text-gray-900 dark:text-white mb-2">خدمة 1</h3>
                            <p class="text-base text-gray-600 dark:text-gray-400">وصف خدمة 1</p>
                        </div>
                    </div>
                </div>
                <div class="w-full p-4 md:w-1/3 lg:w-1/3 xl:w-1/3">
                    <div class="bg-white dark:bg-gray-800 shadow-lg rounded-lg overflow-hidden">
                        <img class="object-cover w-full h-full" src="image2.jpg" alt="Service 2">
                        <div class="p-8">
                            <h3 class="text-lg font-bold text-gray-900 dark:text-white mb-2">خدمة 2</h3>
                            <p class="text-base text-gray-600 dark:text-gray-400">وصف خدمة 2</p>
                        </div>
                    </div>
                </div>
                <div class="w-full p-4 md:w-1/3 lg:w-1/3 xl:w-1/3">
                    <div class="bg-white dark:bg-gray-800 shadow-lg rounded-lg overflow-hidden">
                        <img class="object-cover w-full h-full" src="image3.jpg" alt="Service 3">
                        <div class="p-8">
                            <h3 class="text-lg font-bold text-gray-900 dark:text-white mb-2">خدمة 3</h3>
                            <p class="text-base text-gray-600 dark:text-gray-400">وصف خدمة 3</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <!-- القسم الخاص بنموذج الاشتراك -->
        <section class="py-12">
            <div class="container mx-auto text-center mb-12">
                <h2 class="text-3xl font-bold text-gray-900 dark:text-white mb-8">اشترك معنا</h2>
            </div>
            <div class="container mx-auto flex flex-wrap justify-center md:justify-start -mx-4 mb-12">
                <div class="w-full p-4 md:w-1/2 lg:w-1/2 xl:w-1/2">
                    <form class="bg-white dark:bg-gray-800 shadow-lg rounded-lg overflow-hidden">
                        <div class="p-8">
                            <h3 class="text-lg font-bold text-gray-900 dark:text-white mb-2">اشترك معنا</h3>
                            <input class="block w-full mb-4 p-4 bg-gray-100 dark:bg-gray-600 rounded-lg" type="email" placeholder="إيداع البريد الإلكتروني">
                            <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">اشترك</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
        <!-- القسم التذييلي -->
        <footer class="bg-gray-900 dark:bg-white text-white">
            <div class="container mx-auto text-center">
                <p class="text-lg md:text-xl lg:text-2xl font-bold py-4">صُنع بذكاء بواسطة براندو</p>
            </div>
        </footer>
    </main>
</body>
</html>
